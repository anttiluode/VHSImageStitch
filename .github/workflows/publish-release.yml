name: Publish Windows downloads to Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-release.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to build and attach
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  publish-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout the tagged release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || 'v1.0.0' }}

      - name: Set up Python 3.13 on Windows x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Package EXE and portable ZIP; run packaged self-tests
        shell: pwsh
        run: .\build-windows.ps1

      - name: Attach tested executables to the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || 'v1.0.0' }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "Release tag not published." }
          gh release upload "$env:RELEASE_TAG" "release/VHSImageStitch-Windows-x64.exe" "release/VHSImageStitch-Windows-x64-Portable.zip" --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed." }
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Could not verify uploaded assets." }
